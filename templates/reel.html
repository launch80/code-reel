<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"DM Sans";font-weight:400;src:url(fonts/dm-sans-latin-400-normal.woff2)}
@font-face{font-family:"DM Sans";font-weight:700;src:url(fonts/dm-sans-latin-700-normal.woff2)}
@font-face{font-family:"DM Sans";font-weight:800;src:url(fonts/dm-sans-latin-800-normal.woff2)}
@font-face{font-family:"DM Mono";font-weight:400;src:url(fonts/dm-mono-latin-400-normal.woff2)}
@font-face{font-family:"DM Mono";font-weight:500;src:url(fonts/dm-mono-latin-500-normal.woff2)}
@font-face{font-family:"Instrument Serif";font-style:normal;src:url(fonts/instrument-serif-latin-400-normal.woff2)}
@font-face{font-family:"Instrument Serif";font-style:italic;src:url(fonts/instrument-serif-latin-400-italic.woff2)}
@font-face{font-family:"Russo One";src:url(fonts/russo-one-latin-400-normal.woff2)}
html,body{margin:0;background:#0b0b0c}
canvas{display:block}
body.preview{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:12px;font:14px "DM Mono",monospace;color:#9b9b9b}
body.preview canvas{width:min(96vw,calc((100vh - 90px)*16/9));height:auto;border:1px solid #2a2a2d}
#ui{display:flex;gap:12px;align-items:center;width:min(96vw,calc((100vh - 90px)*16/9))}
#ui button{background:#e85d04;color:#0b0b0c;border:0;padding:6px 14px;font:inherit;font-weight:500;cursor:pointer;border-radius:4px}
#ui input{flex:1;accent-color:#e85d04}
#err{position:fixed;inset:0;display:none;place-items:center;color:#ff8a3d;font:500 20px "DM Mono",monospace;padding:40px;text-align:center}
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas><div id="err"></div>
<script>
// ================= timeline config (loaded from timeline.json / window.__TIMELINE__) =====
// Everything below is DATA-DRIVEN: the reel is a list of scenes
//   {scene:'terminal'|'kinetic'|'cards'|'counter'|'chart'|'quote'|'split'|'endcard',
//    dur:seconds, name?:HUD label, slams?:[extra impact offsets], p:{...params}}
// CUTS / SC / IMPACTS / DUR / dispatch are all DERIVED from it. See references/scenes.md.
let W=1920,H=1080,FPS=60,BPM=120,DUR=15,TL=null;
const DPR=Math.max(1,+(new URLSearchParams(location.search).get('dpr')||1));
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const buf=document.createElement('canvas');const bctx=buf.getContext('2d');
function sizeCanvas(){cv.width=W*DPR;cv.height=H*DPR;buf.width=W*DPR;buf.height=H*DPR}
let C={bg:'#0b0b0c',surf:'#151517',line:'#2a2a2d',text:'#ececec',mute:'#9b9b9b',or:'#e85d04',hot:'#ff8a3d',cream:'#faf9f7'};
let ACC='#e85d04',HOTC='#ff8a3d';
const SANS='"DM Sans"',MONO='"DM Mono"',SERIF='"Instrument Serif"',DISP='"Russo One"';

// ---------- utils ----------
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const eOutExpo=x=>x>=1?1:1-Math.pow(2,-10*x);
const eOutCubic=x=>1-Math.pow(1-x,3);
const eInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eOutBack=x=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const eIn=x=>x*x*x;
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
// theme-color helpers: A(a)=accent rgba, Hh(a)=hot rgba — so `theme` recolors everything
function hx(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255]}
function A(a){const c=hx(ACC);return`rgba(${c[0]},${c[1]},${c[2]},${a})`}
function Hh(a){const c=hx(HOTC);return`rgba(${c[0]},${c[1]},${c[2]},${a})`}
function txt(s,x,y,{f,col=C.text,a=1,align='left',ls='0px',glow=0,gcol=A(0.8),base='alphabetic'}={}){
  if(a<=0)return;ctx.save();if(f)ctx.font=f;ctx.letterSpacing=ls;ctx.textAlign=align;ctx.textBaseline=base;
  ctx.globalAlpha*=a;ctx.fillStyle=col;if(glow){ctx.shadowColor=gcol;ctx.shadowBlur=glow*DPR}
  ctx.fillText(s,x,y);if(glow){ctx.shadowBlur=glow*0.4*DPR;ctx.fillText(s,x,y)}ctx.restore();}
// note: shadowBlur is applied in DEVICE pixels by Chrome (not scaled by the CTM),
// so every shadowBlur must be multiplied by DPR manually.
function tw(s,f,ls='0px'){ctx.save();ctx.font=f;ctx.letterSpacing=ls;const w=ctx.measureText(s).width;ctx.restore();return w}
function typed(s,t,a,b){const n=Math.floor(s.length*prog(t,a,b));return s.slice(0,n)}
function rect(x,y,w,h,col,a=1){ctx.save();ctx.globalAlpha*=a;ctx.fillStyle=col;ctx.fillRect(x,y,w,h);ctx.restore()}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function fmt(n){return Math.round(n).toLocaleString('en-US')}
function cursor(x,y,t,h=34,w=16,col=C.or){if(Math.floor(t*2.6)%2===0)rect(x,y-h,w,h,col)}
// number formatters for card/counter "big" values: {from,to,fmt}
function bigFmt(v,f){
  if(f==='x')return v.toFixed(1)+'\u00d7';
  if(f==='k')return Math.round(v)+'K';
  if(f==='kfmt')return fmt(Math.round(v));
  if(f==='d')return '$'+Math.round(v);
  return String(Math.round(v));
}
// mask-wipe line: text revealed left->right by an expanding clip rect
function wipeLine(s,x,y,wd,p,{f,col,a=1,ls='0px'}={}){
  if(p<=0)return;ctx.save();ctx.beginPath();ctx.rect(x-10,y-((f.match(/(\d+)px/)||[0,60])[1])*1.25,wd*p,(f.match(/(\d+)px/)||[0,60])[1]*1.6);ctx.clip();
  txt(s,x,y,{f,col,a,ls});ctx.restore();
}
// dashed connector from (x1,y1) toward (x2,y2), extending with p
function dashed(x1,y1,x2,y2,p,a=1){
  if(p<=0)return;ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=ACC;ctx.lineWidth=2;ctx.setLineDash([6,8]);
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(lerp(x1,x2,p),lerp(y1,y2,p));ctx.stroke();ctx.restore();
}

// grain
const grains=[];{const r=rng(7);for(let i=0;i<6;i++){const g=document.createElement('canvas');g.width=480;g.height=270;const gc=g.getContext('2d');const id=gc.createImageData(480,270);for(let p=0;p<id.data.length;p+=4){const v=r()*255;id.data[p]=id.data[p+1]=id.data[p+2]=v;id.data[p+3]=255}gc.putImageData(id,0,0);grains.push(g)}}

// ---------- derived timeline ----------
let SC=[],CUTS=[],IMPACTS=[];
function sceneSlams(s){
  // per-scene-type default slam times (seconds relative to scene start),
  // merged with explicit s.slams. Cuts are impacted separately in render().
  const p=s.p||{};
  if(s.scene==='kinetic'&&p.words)return p.words.map(w=>w[1]);
  if(s.scene==='chart'&&p.impact!=null)return[p.impact];
  if(s.scene==='quote'&&p.slam!=null)return[p.slam];
  return[];
}
function buildTimeline(tl){
  TL=tl;
  W=tl.w||1920;H=tl.h||1080;FPS=tl.fps||60;BPM=tl.bpm||120;
  const th=tl.theme||{};
  C={bg:th.bg||'#0b0b0c',surf:th.surf||'#151517',line:th.line||'#2a2a2d',text:th.text||'#ececec',
     mute:th.mute||'#9b9b9b',or:th.accent||'#e85d04',hot:th.hot||'#ff8a3d',cream:th.cream||'#faf9f7'};
  ACC=C.or;HOTC=C.hot;
  document.documentElement.style.setProperty('--accent',ACC);
  SC=[];CUTS=[];IMPACTS=[];
  let t=0;
  for(const s of tl.timeline){
    if(!REG[s.scene])throw new Error('unknown scene type: '+s.scene);
    SC.push([(s.name||s.scene).toUpperCase(),t,t+s.dur]);
    if(t>0)CUTS.push(+t.toFixed(6));
    for(const sl of (s.slams||[]).concat(sceneSlams(s)))IMPACTS.push(+(t+sl).toFixed(6));
    t+=s.dur;
  }
  DUR=t;
  sizeCanvas();
}

// ---------- background ----------
function background(t){
  ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
  // perspective grid floor
  const hor=H*0.593, sceneBoost=(t<CUTS[0]||t>CUTS[CUTS.length-1])?1.6:1;
  ctx.save();ctx.beginPath();ctx.rect(0,hor,W,H-hor);ctx.clip();
  const vg=ctx.createLinearGradient(0,hor,0,H);vg.addColorStop(0,A(0));vg.addColorStop(1,A(1));ctx.lineWidth=1.2;
  const vp=W/2;
  for(let i=-22;i<=22;i++){const xb=vp+i*W*0.0885;ctx.strokeStyle=vg;ctx.globalAlpha=0.12*sceneBoost;ctx.beginPath();ctx.moveTo(vp+i*6,hor);ctx.lineTo(xb*1.8-vp*0.8,H+40);ctx.stroke()}
  const sp=(t*0.9)%1;
  for(let k=0;k<14;k++){const z=(k+1-sp);const y=hor+(H-hor)*Math.pow(z/14,2.2)*1.05;ctx.strokeStyle=ACC;ctx.globalAlpha=0.10*sceneBoost*Math.pow(z/14,1.2);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  ctx.restore();
  // warm glow blobs
  const gx=W*0.78+Math.sin(t*0.6)*120, gy=H*0.85+Math.cos(t*0.5)*60;
  let g=ctx.createRadialGradient(gx,gy,0,gx,gy,900);g.addColorStop(0,A(0.20));g.addColorStop(1,A(0));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  g=ctx.createRadialGradient(200,120,0,200,120,700);g.addColorStop(0,Hh(0.06));g.addColorStop(1,Hh(0));ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // dot matrix top
  ctx.fillStyle='rgba(236,236,236,0.045)';for(let x=40;x<W;x+=48)for(let y=40;y<hor-60;y+=48)ctx.fillRect(x,y,2,2);
}

// ======================= SCENE REGISTRY =======================
const REG={};

// ---- terminal boot: {cmd, prompt, title, rows:[[label,value]], progress:{label,pct}} ----
REG.terminal=(lt,d,p)=>{
  const ap=eOutExpo(prog(lt,0,0.23*d));
  const ex=eIn(prog(lt,0.86*d,1.0*d));
  const pw=1180,ph=560,px=(W-pw)/2,py=(H-ph)/2-10;
  const prompt=p.prompt||'launch80:~$';
  ctx.save();ctx.translate(W/2,H/2);const s=lerp(0.94,1,ap)+ex*0.35;ctx.scale(s,s);ctx.translate(-W/2,-H/2);ctx.globalAlpha=ap*(1-ex);
  ctx.save();ctx.shadowColor=A(0.55);ctx.shadowBlur=40*DPR;rrect(px,py,pw,ph,14);ctx.fillStyle='rgba(15,15,17,0.94)';ctx.fill();ctx.restore();
  rrect(px,py,pw,ph,14);ctx.strokeStyle=A(0.8);ctx.lineWidth=2;ctx.stroke();
  rect(px,py+62,pw,1,C.line);
  [['#ff5f56'],[C.line],[C.line]].forEach((c,i)=>{ctx.beginPath();ctx.arc(px+36+i*30,py+31,9,0,7);ctx.fillStyle=c[0];ctx.fill()});
  const title=p.title||`${prompt} — ${W}×${H}`;
  txt(prompt,px+150,py+40,{f:`500 24px ${MONO}`,col:C.text});
  txt(title,px+pw-30,py+40,{f:`400 20px ${MONO}`,col:C.mute,align:'right'});
  const L=px+50;let y=py+140;const F=`400 34px ${MONO}`;
  txt(prompt,L,y,{f:F,col:C.or});
  const cmd=typed(p.cmd||'',lt,0.12*d,0.48*d);
  txt(cmd,L+tw(prompt+' ',F),y,{f:F,col:C.cream});
  if(lt<0.53*d)cursor(L+tw(prompt+' '+cmd,F)+4,y+4,lt,36,18);
  const rows=p.rows||[];
  rows.forEach((r,i)=>{const a=prog(lt,0.52*d+i*0.053*d,0.56*d+i*0.053*d);if(!a)return;const yy=y+66+i*54;
    txt('[ok]',L,yy,{f:`500 30px ${MONO}`,col:C.or,a});txt(r[0],L+110,yy,{f:`400 30px ${MONO}`,col:C.text,a});txt(r[1],L+400,yy,{f:`400 30px ${MONO}`,col:C.mute,a})});
  if(p.progress){const bp=prog(lt,0.72*d,0.90*d);const yy=y+66+rows.length*54+18;
    txt(p.progress.label||'rendering',L,yy,{f:`400 30px ${MONO}`,col:C.text});
    const bx=L+190,bw=720;rect(bx,yy-22,bw,24,C.line);rect(bx,yy-22,bw*eOutCubic(bp),24,C.or);
    txt(Math.round(bp*(p.progress.pct||100))+'%',bx+bw+24,yy,{f:`500 30px ${MONO}`,col:C.cream})}
  ctx.restore();
};

// ---- kinetic words: {intro, words:[[text, offset, note, val]]} (offsets relative, seconds) ----
REG.kinetic=(lt,d,p)=>{
  const out=eIn(prog(lt,0.88*d,0.98*d));
  ctx.save();ctx.translate(-out*260,0);ctx.globalAlpha=1-out;
  if(p.intro){
    const ip=eOutExpo(prog(lt,0.008*d,0.18*d));
    wipeLine(p.intro,160,270,1400,ip,{f:`italic 400 76px ${SERIF}`,col:C.mute});
    rect(160,300,420*ip,3,C.or);
  }
  const words=p.words||[];
  const F=`180px ${DISP}`;
  words.forEach(([w,off,col,note,val],i)=>{
    const st=off!=null?off:0.2*d+i*0.2*d;
    const colr=col==='ACCENT'?C.or:(col||C.cream);
    const pr=prog(lt,st-0.02,st+0.22);if(pr<=0)return;
    const e=eOutExpo(pr);const sc=lerp(1.9,1,e);const y=520+i*215;const x=160;
    ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);
    const g=(1-e)*40;
    txt(w,-g,0,{f:F,col:A(0.55),a:clamp(pr*3)});
    txt(w,g,0,{f:F,col:'rgba(120,160,255,0.25)',a:clamp(pr*3)*(1-e)});
    txt(w,0,0,{f:F,col:colr,a:clamp(pr*3),glow:i===words.length-1?50:0});
    ctx.restore();
    // annotation — never collide with the word: measure the FINAL settled string
    const ap=eOutExpo(prog(lt,st+0.12,st+0.45));
    const wEnd=x+tw(w,F);
    const ax=1330;
    if(wEnd+30<ax){
      dashed(wEnd+40,y-70,ax-30,y-70,ap);
      txt((note||'').toUpperCase(),ax,y-96,{f:`400 24px ${MONO}`,col:C.mute,a:ap,ls:'3px'});
      txt(val||'',ax,y-36,{f:`500 52px ${MONO}`,col:i===words.length-1?C.hot:C.cream,a:ap});
    }else{
      txt((note||'').toUpperCase(),x,y+70,{f:`400 24px ${MONO}`,col:C.mute,a:ap,ls:'3px'});
      txt(val||'',x,y+130,{f:`500 52px ${MONO}`,col:i===words.length-1?C.hot:C.cream,a:ap});
    }
  });
  ctx.restore();
};

// ---- stat cards: {header, kicker, cards:[{tag,big:{from,to,fmt},unit,sub,label,viz}], ticker:{label,items}} ----
REG.cards=(lt,d,p)=>{
  const hp=eOutExpo(prog(lt,0,0.17*d));
  const fade=1-prog(lt,0.9*d,0.98*d);
  txt(p.header||'',160,190,{f:`500 24px ${MONO}`,col:C.or,a:hp*fade,ls:'3px'});
  ctx.save();ctx.beginPath();ctx.rect(150,200,W-220,110);ctx.clip();
  txt(p.kicker||'',160,lerp(380,282,hp),{f:`400 88px ${SERIF}`,col:C.cream,a:fade});ctx.restore();
  const cards=p.cards||[];const n=Math.max(1,cards.length);
  const cw=Math.floor((W-320-(n-1)*35)/n),ch=520,gap=35,cy=340;
  cards.forEach((c,i)=>{
    const st=0.05*d+i*0.047*d;const pr=eOutExpo(prog(lt,st,st+0.6));const o=eIn(prog(lt,0.88*d+i*0.02*d,0.98*d));
    if(pr<=0)return;const x=160+i*(cw+gap),y=cy+lerp(120,0,pr)+o*140;
    ctx.save();ctx.globalAlpha=pr*(1-o);
    rrect(x,y,cw,ch,12);ctx.fillStyle='rgba(21,21,23,0.92)';ctx.fill();ctx.strokeStyle=C.line;ctx.lineWidth=1.5;ctx.stroke();
    rect(x,y,cw*eOutExpo(prog(lt,st+0.2,st+0.9)),4,C.or);
    txt(c.tag||'',x+36,y+62,{f:`500 22px ${MONO}`,col:C.or,ls:'2px'});
    const v=eOutCubic(prog(lt,st+0.25,st+1.5));
    const bf=c.big||{from:0,to:100,fmt:'int'};
    const bigS=bigFmt(lerp(bf.from,bf.to,v),bf.fmt);
    // fit: measure the FINAL (widest) string so the unit never spills past the card
    const UF=`500 30px ${MONO}`;let bs=136;
    while(bs>96&&32+tw(bigFmt(bf.to,bf.fmt),`${bs}px ${DISP}`)+8+tw(c.unit||'',UF)>cw-30)bs-=4;
    txt(bigS,x+32,y+215,{f:`${bs}px ${DISP}`,col:C.cream,glow:v>=1?18:0,gcol:A(0.8)});
    txt(c.unit||'',x+40+tw(bigS,`${bs}px ${DISP}`),y+215,{f:UF,col:C.mute});
    txt(c.sub||'',x+36,y+262,{f:`400 22px ${MONO}`,col:C.mute});
    const vx=x+36,vy=y+300,vw=cw-72;
    if(c.viz==='bars'){
      // normalize by the larger of the two so count-down cards shrink correctly
      const mx=Math.max(Math.abs(bf.from),Math.abs(bf.to),1);
      const r0=bf.from/mx,r1=bf.to/mx;
      txt('before',vx,vy+22,{f:`400 18px ${MONO}`,col:C.mute});rect(vx+100,vy+6,(vw-100)*r0*eOutCubic(prog(lt,st+0.2,st+0.7)),20,'#3a3a3e');
      txt('after',vx,vy+66,{f:`400 18px ${MONO}`,col:C.cream});rect(vx+100,vy+50,(vw-100)*lerp(r0,r1,v)*eOutCubic(prog(lt,st+0.2,st+0.7)),20,C.or);
      for(let k=0;k<3;k++){const px=vx+100+((lt*1.2+k/3)%1)*(vw-100)*lerp(r0,r1,v);rect(px,vy+50,6,20,C.hot,0.9)}
    } else if(c.viz==='kv'){
      const full=vw;rect(vx,vy,full,70,'#1f1f22');ctx.strokeStyle='#3a3a3e';ctx.lineWidth=1;ctx.strokeRect(vx,vy,full,70);
      const ratio=bf.to?bf.from/bf.to:1;
      const cur=full/lerp(1,ratio>0?1/ratio:1,v);for(let k=0;k<Math.floor(cur/14);k++)rect(vx+k*14+2,vy+6,10,58,C.or,0.9);
      txt(c.vizTo||'',vx+full-8,vy+100,{f:`400 18px ${MONO}`,col:C.mute,align:'right'});txt(c.vizFrom||'',vx,vy+100,{f:`400 18px ${MONO}`,col:C.hot});
    } else if(c.viz==='ctx'){
      const nn=48;for(let k=0;k<nn;k++){const on=k/nn<v;rect(vx+k*(vw/nn),vy+10,vw/nn-3,50,on?C.or:C.line,on?lerp(0.35,1,k/nn):1)}
      txt('0',vx,vy+100,{f:`400 18px ${MONO}`,col:C.mute});txt(c.vizTo||fmt(bf.to),vx+vw,vy+100,{f:`400 18px ${MONO}`,col:C.hot,align:'right'});
    }
    txt(c.label||'',x+36,y+ch-40,{f:`400 26px ${SANS}`,col:C.text});
    ctx.restore();
  });
  if(p.ticker&&p.ticker.items&&p.ticker.items.length){
    const tk=p.ticker.items.join('    ')+'    ';
    const ta=prog(lt,0.1*d,0.23*d)*fade;const F=`400 22px ${MONO}`;const w=tw(tk,F);const off=(lt*260)%w;
    ctx.save();ctx.globalAlpha=ta;rect(0,878,W,1,C.line);rect(0,924,W,1,C.line);
    for(let k=-1;k<3;k++)txt(tk,230-off+k*w,909,{f:F,col:C.mute});
    rect(-100,879,320,44,C.bg);txt(p.ticker.label||'TICKER',60,909,{f:`500 20px ${MONO}`,col:C.or,ls:'2px'});
    ctx.restore();
  }
};

// ---- big counter + oscilloscope: {kicker, prompt, big:{from,to,fmt}, unit, sub, tagline, typing, scope:[120]} ----
REG.counter=(lt,d,p)=>{
  const out=eIn(prog(lt,0.9*d,1.0*d));
  ctx.save();ctx.globalAlpha=1-out;
  const scope=p.scope||[];
  const dp=eOutCubic(prog(lt,0.1,0.53*d));
  if(scope.length){
    const gx=0,gy=900,gw=W,gh=520;
    ctx.save();ctx.beginPath();
    let started=false;
    scope.forEach((yy,i)=>{const fr=i/(scope.length-1);if(fr>dp)return;
      const X=gx+fr*gw,Y=gy-yy*gh;started?ctx.lineTo(X,Y):(ctx.moveTo(X,Y),started=true)});
    ctx.strokeStyle=A(0.45);ctx.lineWidth=3;ctx.shadowColor=ACC;ctx.shadowBlur=20*DPR;ctx.stroke();ctx.restore();
    const idx=Math.min(scope.length-1,Math.max(0,Math.floor(dp*(scope.length-1))));
    ctx.beginPath();ctx.arc(idx/(scope.length-1)*gw,900-scope[idx]*gh,7,0,7);ctx.fillStyle=C.hot;ctx.fill();
  }

// ---- growth chart: {line, grow:[values], months, label, sub, max, impact, seed} ----
REG.chart=(lt,d,p)=>{
  const grow=p.grow||[0,1],months=p.months||[];const max=p.max||grow[grow.length-1];
  const impact=p.impact!=null?p.impact:0.72*d;
  const growth=x=>{const n=grow.length-1;const i=Math.min(n-1,Math.floor(x*n));const f=x*n-i;return lerp(grow[i],grow[i+1],f)};
  const out=eIn(prog(lt,0.88*d,0.98*d));
  ctx.save();ctx.globalAlpha=1-out;ctx.translate(0,-out*60);
  const hp=eOutExpo(prog(lt,0,0.45));
  if(p.line)wipeLine(p.line,160,260,1700,hp,{f:`italic 400 76px ${SERIF}`,col:C.cream});
  const v=eOutCubic(prog(lt,0.2,impact));const val=growth(v);
  const hit=prog(lt,impact,impact+0.3);const pop=1+0.12*Math.sin(Math.PI*clamp(hit))*(1-hit);
  ctx.save();ctx.translate(160,560);ctx.scale(pop,pop);
  txt(bigFmt(val,'kfmt'),0,0,{f:`250px ${DISP}`,col:C.or,glow:lt>impact?70:25,gcol:A(0.8)});ctx.restore();
  txt(p.label||'',160,720,{f:`150px ${DISP}`,col:C.cream,a:eOutExpo(prog(lt,0.25,0.6))});
  txt(p.sub||'',164,800,{f:`500 30px ${MONO}`,col:C.mute,a:eOutExpo(prog(lt,0.45,0.8)),ls:'8px'});
  // chart
  const cx=1150,cyb=800,cw=640,chh=460;const ca=eOutExpo(prog(lt,0.1,0.5));
  ctx.save();ctx.globalAlpha*=ca;
  for(let k=0;k<=4;k++){rect(cx,cyb-k*chh/4,cw,1,C.line);txt(fmt(k*max/4),cx+cw+16,cyb-k*chh/4+6,{f:`400 18px ${MONO}`,col:C.mute})}
  months.forEach((m,i)=>txt(m,cx+i*cw/(months.length-1),cyb+36,{f:`400 18px ${MONO}`,col:i===months.length-1?C.hot:C.mute,align:'center'}));
  ctx.beginPath();const N=100;let lx=cx,ly=cyb;
  for(let i=0;i<=N;i++){const xx=i/N*v;lx=cx+xx*cw;ly=cyb-growth(xx)/max*chh;i?ctx.lineTo(lx,ly):ctx.moveTo(lx,ly)}
  ctx.save();ctx.lineTo(lx,cyb);ctx.lineTo(cx,cyb);ctx.closePath();const ag=ctx.createLinearGradient(0,cyb-chh,0,cyb);ag.addColorStop(0,A(0.35));ag.addColorStop(1,A(0));ctx.fillStyle=ag;ctx.fill();ctx.restore();
  ctx.beginPath();for(let i=0;i<=N;i++){const xx=i/N*v;const X=cx+xx*cw,Y=cyb-growth(xx)/max*chh;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)}
  ctx.strokeStyle=ACC;ctx.lineWidth=4;ctx.shadowColor=ACC;ctx.shadowBlur=18*DPR;ctx.stroke();ctx.shadowBlur=0;
  const pr=(lt*2)%1;ctx.beginPath();ctx.arc(lx,ly,8+pr*28,0,7);ctx.strokeStyle=Hh(1-pr);ctx.lineWidth=2;ctx.stroke();
  ctx.beginPath();ctx.arc(lx,ly,8,0,7);ctx.fillStyle=C.cream;ctx.fill();
  ctx.restore();
  // burst
  if(lt>impact){
    if(!burstParts||burstParts.seed!==(p.seed||1)){burstParts={seed:p.seed||1,parts:[]};const r=rng(99);for(let i=0;i<140;i++){const a=r()*Math.PI*2,s=300+r()*1100;burstParts.parts.push({a,s,z:r()*3+1,ox:160+r()*820,oy:470})}}
    const pt=lt-impact;burstParts.parts.forEach(q=>{const dd=q.s*eOutCubic(clamp(pt/0.7));const X=q.ox+Math.cos(q.a)*dd,Y=q.oy+Math.sin(q.a)*dd*0.6;const al=1-clamp(pt/0.6);if(al<=0)return;rect(X,Y,q.z*2,q.z*2,C.hot,al)});
  }
  ctx.restore();
};

  const m=48,L=36;[[m,m,1,1],[W-m,m,-1,1],[m,H-m,1,-1],[W-m,H-m,-1,-1]].forEach(([x,y,sx,sy])=>{ctx.beginPath();ctx.moveTo(x,y+L*sy);ctx.lineTo(x,y);ctx.lineTo(x+L*sx,y);ctx.stroke()});
  ctx.restore();

  if(Math.floor(t*2)%2===0){ctx.beginPath();ctx.arc(W-440,86,7,0,7);ctx.fillStyle='#ff3b30';ctx.fill()}
  txt('REC',W-422,92,{f:`500 18px ${MONO}`,col:C.text,ls:'3px'});
  txt('TC '+tc,W-100,92,{f:F,col:C.mute,align:'right',ls:'2px'});
  const si=SC.findIndex(s=>t>=s[1]&&t<s[2]);const s=SC[Math.max(0,si)];
  txt(`SCENE ${String(si+1).padStart(2,'0')}/${String(SC.length).padStart(2,'0')} — ${s[0]}`,100,H-80,{f:F,col:C.mute,ls:'3px'});
  txt(`${W}×${H} · ${FPS}FPS · F${String(fr).padStart(4,'0')}`,W-100,H-80,{f:F,col:C.mute,align:'right',ls:'2px'});

// ======================= POST =======================
function post(t,fi){
  // Post runs in DEVICE pixels (identity transform) so 1px scanlines, grain
  // blocks and chromatic splits stay pixel-exact at any DPR, then downscale.
  const VW=cv.width,VH=cv.height;
  ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;
  // glitch around cuts
  let gl=0;CUTS.forEach(c=>{const d=t-c;if(d>-0.07&&d<0.16)gl=Math.max(gl,1-Math.abs(d)/0.16)});
  if(gl>0){bctx.clearRect(0,0,VW,VH);bctx.drawImage(cv,0,0);const r=rng(fi*31+5);
    const n=10;for(let i=0;i<n;i++){const y=r()*H,h=10+r()*90,dx=(r()-0.5)*260*gl;
      ctx.drawImage(buf,0,y*DPR,W*DPR,h*DPR,dx*DPR,y*DPR,W*DPR,h*DPR)}
    ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=0.35*gl;ctx.drawImage(buf,18*gl*DPR,0);ctx.globalAlpha=0.2*gl;ctx.drawImage(buf,-18*gl*DPR,0);ctx.restore()}
  // flash — keep flash alpha <= 0.3 on cuts, <= 0.14 on sub-impacts
  let fl=0;IMPACTS.forEach(c=>{const d=t-c;if(d>=0&&d<0.2)fl=Math.max(fl,Math.pow(1-d/0.2,2)*(CUTS.includes(c)?0.3:0.14))});
  if(fl>0){ctx.save();ctx.globalCompositeOperation='screen';ctx.fillStyle=Hh(fl);ctx.fillRect(0,0,VW,VH);ctx.restore()}
  // scanlines — DPR px dark every 4*DPR device px (same 25% duty at any DPR)
  ctx.fillStyle='rgba(0,0,0,0.10)';for(let y=0;y<VH;y+=4*DPR)ctx.fillRect(0,y,VW,DPR);
  // grain
  ctx.save();ctx.globalAlpha=0.055;ctx.globalCompositeOperation='overlay';ctx.imageSmoothingEnabled=false;ctx.drawImage(grains[fi%grains.length],0,0,VW,VH);ctx.restore();
  // vignette
  const g=ctx.createRadialGradient(VW/2,VH/2,VH*0.45,VW/2,VH/2,VH*1.05);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.6)');ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);
  // fade in/out
  const fo=Math.max(1-prog(t,0,0.12),prog(t,DUR-0.25,DUR));if(fo>0){ctx.globalAlpha=fo;ctx.fillStyle='#000';ctx.fillRect(0,0,VW,VH);ctx.globalAlpha=1}
  ctx.restore();
}

// ======================= MASTER =======================
function render(t){
  if(!TL)return;
  const fi=Math.round(t*FPS);
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  background(t);
  // camera shake on impacts + slow push
  let sk=0;IMPACTS.forEach(c=>{const d=t-c;if(d>=0&&d<0.3)sk=Math.max(sk,(1-d/0.3))});
  const r=rng(fi+1);const sx=(r()-0.5)*22*sk,sy=(r()-0.5)*22*sk;
  const si=SC.findIndex(s=>t>=s[1]&&t<s[2]);const sp=si>=0?prog(t,SC[si][1],SC[si][2]):1;const z=1+0.03*sp;
  ctx.save();ctx.translate(W/2+sx,H/2+sy);ctx.scale(z,z);ctx.translate(-W/2,-H/2);
  const idx=si>=0?si:SC.length-1;const s=TL.timeline[idx];
  REG[s.scene](t-SC[idx][1],SC[idx][2]-SC[idx][1],s.p||{});
  ctx.restore();
  hud(t);
  post(t,fi);
}

// ================= CUSTOM SCENES (mode 2: the blueprint path) =================
// A project-local scene_custom.js can add scene types WITHOUT touching this
// file. It runs in this script's scope, so every motion helper is available:
//   defineScene('orbit', (lt, d, p) => { ... });   // lt = local time in scene,
//   // d = scene duration, p = params from timeline. Draw with txt/tw/rrect/
//   // typed/rng/prog/ease/C/W/H/DPR — same contract as the built-in REG types.
// Rules: draw only inside [0, d); never mutate SC/CUTS/IMPACTS; keep text
// inside 90% safe area; validate.py accepts types declared in scene_custom.js.
window.defineScene=(name,fn)=>{
  if(!/^[a-z][a-z0-9_]*$/.test(name))throw new Error('defineScene: bad name '+name);
  if(REG[name])throw new Error('defineScene: built-in type '+name+' cannot be overridden');
  REG[name]=fn;
};
async function loadCustomScenes(){
  // optional file — silent 404 is fine. MUST be a <script> tag, not fetch():
  // fetch on file:// is CORS-blocked even with --allow-file-access-from-files,
  // while classic scripts run fine and see this script's top-level let/const
  // bindings (they live in the global lexical scope).
  return new Promise(res=>{
    const s=document.createElement('script');s.src='scene_custom.js';
    s.onload=()=>{window.__CUSTOM_SCENES__=true;res()};s.onerror=res;
    document.head.appendChild(s);
  });
}

// ---------- timeline loading: window.__TIMELINE__ (injected by render.py) or fetch ----------
async function loadTimeline(){
  if(window.__TIMELINE__)return window.__TIMELINE__;
  try{const r=await fetch('timeline.json');if(r.ok)return await r.json()}catch(e){}
  return null;
}
window.ready=(async()=>{

    pp.onclick=()=>playing?pause():play();
    sc.oninput=()=>{base=+sc.value;if(playing){t0=performance.now();au.currentTime=base}draw(base)};
    mu.onchange=()=>{if(!mu.checked)au.pause();else if(playing){au.currentTime=now();au.play().catch(()=>{})}};
    addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();pp.click()}
      if(e.code==='ArrowRight'){base=Math.min(DUR,now()+1/FPS);if(playing)pause();draw(base)}
      if(e.code==='ArrowLeft'){base=Math.max(0,now()-1/FPS);if(playing)pause();draw(base)}});
    (function loop(){const t=now();if(playing){draw(t);if(t>=DUR){pause();base=DUR}}requestAnimationFrame(loop)})();draw(0);
  });
}
</script></body></html>
